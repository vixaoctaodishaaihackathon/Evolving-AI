version: '3.8'

services:
  # -------------------------------------------------------------------------
  # Redpanda (High-throughput Kafka-compatible real-time event streaming)
  # -------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: supply_chain_redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"
      - "8082:8082"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda Web Console for Topic & Message Inspection
  console:
    image: docker.redpanda.com/redpandadata/console:v2.4.3
    container_name: supply_chain_console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:29092"
    depends_on:
      - redpanda

  # -------------------------------------------------------------------------
  # ClickHouse (OLAP Columnar Time-Series Analytics for Freight, Telemetry, Rates)
  # -------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.2
    container_name: supply_chain_clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native TCP client
    environment:
      CLICKHOUSE_DB: supply_chain_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Neo4j (Graph Database for Tier-N Supplier Topology & Blast-Radius Traversal)
  # -------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.17-community
    container_name: supply_chain_neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/SupplyChainPass2026!
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - ./docker/neo4j/init_graph.cypher:/var/lib/neo4j/import/init_graph.cypher:ro
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p SupplyChainPass2026! 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # PostgreSQL (Enterprise User Authentication, Session Store & Audit Ledger)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: supply_chain_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: supply_chain_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SupplyChainPass2026!
    volumes:
      - ./docker/postgres/init_auth.sql:/docker-entrypoint-initdb.d/init_auth.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supply_chain_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Arize Phoenix (AI Observability & Traceability for LangGraph Execution)
  # -------------------------------------------------------------------------
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: supply_chain_phoenix
    ports:
      - "6006:6006" # UI and collector
    environment:
      PHOENIX_PORT: 6006

volumes:
  clickhouse_data:
  neo4j_data:
  postgres_data:

